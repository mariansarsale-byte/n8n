name: RDP-n8n-CP
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
    - name: Install Tailscale
      run: |
        Invoke-WebRequest -Uri https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi -OutFile tailscale.msi
        Start-Process msiexec.exe -Wait -ArgumentList "/i tailscale.msi /quiet"
        Start-Sleep -Seconds 20
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TSKEY }} --hostname=gh-rdp-n8n --accept-routes --accept-dns=false
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 1
        net user runneradmin P@ssw0rd123!
        net localgroup administrators runneradmin /add
    - name: Install n8n and NodeJS
      run: |
        choco install nodejs -y
        npm install -g n8n
    - name: Keep Alive + Show Info
      run: |
        Write-Host "=========================================="
        Write-Host " RDP USER: runneradmin"
        Write-Host " RDP PASS: P@ssw0rd123!"
        Write-Host " TAILSCALE IP: CHECK IN TAILSCALE ADMIN"
        Write-Host " n8n: will run on http://localhost:5678"
        Write-Host "=========================================="
        npx n8n start --tunnel &
        while ($true) { Write-Host "RDP + n8n Running... $(Get-Date)"; Start-Sleep -Seconds 300 }
