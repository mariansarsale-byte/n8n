name: RDP-n8n-CP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Setup RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)

      - name: Install Tailscale
        run: |
          Invoke-WebRequest https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe -OutFile ts.exe
          Start-Process .\ts.exe -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 10

      - name: Connect Tailscale
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey ${{ secrets.TSKEY }} --hostname cp-runner-n8n
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: Install n8n
        run: |
          npm install -g n8n
          Start-Process n8n -ArgumentList "start" -WindowStyle Hidden
          Write-Host "n8n ready at port 5678"

      - name: Keep Alive 6 Hours
        run: |
          Write-Host "=== INFO ==="
          Write-Host "RDP User: runneradmin"
          Write-Host "RDP Pass: P@ssw0rd123!"
          Write-Host "n8n: http://TAILSCALE-IP:5678"
          while($true){ Write-Host "CP Runner is alive..."; Start-Sleep -Seconds 300 }
